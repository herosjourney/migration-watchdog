name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout watchdog repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # 3.12 required: currency_auditor.py uses match/case (Python 3.10+)

      - name: Install package and test dependencies
        run: |
          pip install -e .
          pip install pytest pytest-asyncio hypothesis pytest-forked
          # Verify the package is importable
          python -c "import migration_watchdog; print('migration_watchdog OK')"
          python -c "from migration_watchdog.payload_store import PayloadStore; print('submodule imports OK')"

      - name: Run tests — fixture and integration tests (real package)
        # These tests use the real migration_watchdog package.
        # Run before stub-based tests to avoid sys.modules pollution.
        run: |
          pytest \
            migration_watchdog/tests/test_currency_fixtures.py \
            migration_watchdog/tests/test_automation_fixtures.py \
            -v --tb=short

      - name: Run tests — pipeline tests (stub-based)
        # test_main_pipeline stubs migration_watchdog.* at module level.
        # Run in a separate step so stubs don't pollute the fixture tests above.
        run: |
          pytest migration_watchdog/tests/test_main_pipeline.py -v --tb=short

      - name: Run tests — PR smoke tests (stub-based)
        # test_pr_smoke also stubs migration_watchdog.* at module level.
        # Separate step for the same reason.
        run: |
          pytest migration_watchdog/tests/test_pr_smoke.py -v --tb=short
