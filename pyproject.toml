[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "migration-watchdog"
version = "1.3.0"
description = "Migration Plugin Watchdog — currency and automation auditors"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "botocore>=1.34",
    "httpx>=0.27",
    "fastapi>=0.111",
    "mangum>=0.17",
    "python-dateutil>=2.9",
    "PyJWT>=2.8",
    # LLM extraction uses Strands Agents with Bedrock backend
    "strands-agents>=0.1",
    "strands-agents-tools>=0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["migration_watchdog*"]

[tool.setuptools.package-data]
migration_watchdog = [
    "alias_table.json",
    "cli_command_index.json",
]
