# Scenario Simulation Agent — Persona Library
# 12 personas covering the real distribution of migration plugin users.
# Each persona anchors a regression test for a specific routing/coverage path.
# Personas 6–8 are anchored to PR #30 (Anthropic + gateway routing fixes).

- id: gcp-infra-only
  description: >
    Startup running Cloud Run + Cloud SQL (PostgreSQL) on GCP with Terraform.
    No AI/LLM workloads. Pure infrastructure migration path.
  infrastructure:
    gcp_services:
      - cloud_run
      - cloud_sql_postgresql
    has_terraform: true
    has_billing_data: false
  ai_stack:
    provider: null
    models: []
    frameworks: []
    integration_pattern: null
    gateway_type: null
  agentic_profile:
    is_agentic: false
    framework: null
    tools: []
    orchestration_pattern: null
  expected_path:
    discover_outputs:
      - gcp-resource-inventory.json
      - gcp-resource-clusters.json
    clarify_route: clarify-global
    design_route: design-infra
    design_refs:
      - compute.md
      - database.md
  known_gaps_fixed_by_prs: []

