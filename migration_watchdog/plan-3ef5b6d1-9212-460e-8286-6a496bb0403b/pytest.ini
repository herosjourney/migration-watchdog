[pytest]
asyncio_mode = strict
testpaths = tests
# Test files must be run in this order to avoid sys.modules stub pollution:
# 1. test_currency_fixtures.py  (no stubs)
# 2. test_automation_fixtures.py (no stubs)
# 3. test_main_pipeline.py  (stubs migration_watchdog.* — run last in group A)
# 4. test_pr_smoke.py  (stubs migration_watchdog.* — run last in group B)
#
# Recommended invocations:
#   pytest tests/test_currency_fixtures.py tests/test_automation_fixtures.py
#   pytest tests/test_main_pipeline.py
#   pytest tests/test_pr_smoke.py
#
# Or all at once with process isolation (requires pytest-forked):
#   pytest --forked tests/
